name: Deploy Anchorfield demo to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private Anchorfield project
        uses: actions/checkout@v4
        with:
          repository: shirishdesigner/anchorfield-smart-buy
          ref: demo
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static SPA
        run: npm run build

      - name: Prepare GitHub Pages entry point
        run: |
          set -e
          if [ -f .output/public/_shell.html ]; then
            cp .output/public/_shell.html .output/public/index.html
          elif [ ! -f .output/public/index.html ]; then
            entry_js=$(find .output/public/assets -maxdepth 1 -type f -name 'index-*.js' | head -1)
            style_css=$(find .output/public/assets -maxdepth 1 -type f -name 'styles-*.css' | head -1)
            if [ -z "$entry_js" ]; then
              echo "No SPA entry JavaScript found"
              find .output/public/assets -maxdepth 1 -type f | sort
              exit 1
            fi
            entry_js="${entry_js#.output/public/}"
            style_css="${style_css#.output/public/}"
            cat > .output/public/index.html <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>AnchorField Smart Buy</title>
              ${style_css:+<link rel="stylesheet" href="./$style_css" />}
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="./$entry_js"></script>
            </body>
          </html>
          EOF
          fi
          cp .output/public/index.html .output/public/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
