name: Deploy Anchorfield demo to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private Anchorfield project
        uses: actions/checkout@v4
        with:
          repository: shirishdesigner/anchorfield-smart-buy
          ref: demo
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static SPA
        run: npm run build

      - name: Prepare GitHub Pages entry point
        shell: bash
        run: |
          set -euo pipefail
          public_dir=".output/public"

          if [ -f "$public_dir/index.html" ]; then
            echo "Using TanStack generated index.html."
            cp "$public_dir/index.html" "$public_dir/404.html"
          elif [ -f "$public_dir/_shell.html" ]; then
            cp "$public_dir/_shell.html" "$public_dir/index.html"
            cp "$public_dir/_shell.html" "$public_dir/404.html"
            echo "Using TanStack generated SPA shell."
          else
            echo "No TanStack entry point was generated."
            find "$public_dir" -maxdepth 2 -type f | sort
            exit 1
          fi

      - name: Verify Pages files
        run: |
          test -f .output/public/index.html
          test -f .output/public/404.html
          echo "Pages entry points verified."
          find .output/public -maxdepth 2 -type f | sort | head -80

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
